<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ไพ่เร็ว สูตรคำนวน - มือถือ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1e9}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(135deg,#9b761d,#d4af37,#e7e9ec);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:800;color:#2b2415}.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar a{flex:0 0 auto;color:#2b2415;text-decoration:none;background:#ffffff99;padding:6px 9px;border-radius:999px;touch-action:manipulation}.frame{display:block;width:100vw;max-width:100%;height:calc(100dvh - 48px);border:0;background:white}</style></head><body><div class="bar"><span>📱 ไพ่เร็ว สูตรคำนวน — มือถือ</span><a href="index.html">หน้าหลัก</a></div><iframe id="app" class="frame" src="fast-card-formulas-22.html?mobile=4"></iframe><script>
const app=document.getElementById('app');
app.addEventListener('load',()=>{
  const d=app.contentDocument;
  try{
    let vp=d.querySelector('meta[name="viewport"]');
    if(!vp){vp=d.createElement('meta');vp.name='viewport';d.head.appendChild(vp)}
    vp.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';

    const s=d.createElement('style');
    s.textContent=`
      *{box-sizing:border-box!important}
      html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;font-size:14px!important}
      .wrap{width:100%!important;max-width:430px!important;margin:0 auto!important;padding:8px!important}
      .grid{grid-template-columns:1fr!important;gap:8px!important}
      .wide{grid-column:auto!important}
      .card{width:100%!important;min-width:0!important;padding:12px!important;border-radius:16px!important}
      .row2,.historyPad,.stats,.moneySummary,.actions,.moneyBox .row2,.moneygrid,.recs{grid-template-columns:1fr!important}
      .historyPad{gap:8px!important}
      h2{font-size:19px!important;line-height:1.28!important}
      h3{font-size:16px!important}
      label,.note{font-size:13px!important;line-height:1.4!important}
      select,input,textarea{font-size:16px!important;min-height:44px!important;padding:10px!important}
      textarea{min-height:205px!important;font-size:17px!important;line-height:1.5!important}
      .preview{font-size:20px!important;letter-spacing:3px!important;padding:10px!important}
      .omit{font-size:29px!important}
      .pad{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px!important;width:100%!important}
      .pad button{min-width:0!important;min-height:48px!important;font-size:20px!important;border-radius:10px!important;touch-action:manipulation!important;-webkit-user-select:none!important;user-select:none!important;-webkit-tap-highlight-color:transparent!important}
      .padActions button,.actions button,.quick button,.toggle{font-size:14px!important;min-height:40px!important;touch-action:manipulation!important}
      .quick{gap:6px!important}.quick button{padding:7px 10px!important}
      .money,.omitbox{padding:11px!important}
      .scroll{width:100%!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
      .scroll table{min-width:650px!important;width:650px!important;max-width:none!important}
      th,td{font-size:12px!important;padding:7px 4px!important;line-height:1.3!important}
      .item{font-size:12px!important;padding:8px 0!important;line-height:1.35!important}.item .note{font-size:11px!important}
      .hero{padding:13px!important}.hero h1{font-size:25px!important;line-height:1.2!important}.hero div{font-size:13px!important}
      .head{gap:8px!important;margin-bottom:10px!important;flex-wrap:wrap!important}
      button,a{touch-action:manipulation!important}
      @media(min-width:600px){.wrap{max-width:460px!important}}
    `;
    d.head.appendChild(s);

    const keys=[...d.querySelectorAll('#keypad button,.pad button')];
    keys.forEach(b=>{
      b.style.touchAction='manipulation';
      b.addEventListener('touchstart',e=>{e.preventDefault()},{passive:false});
      b.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();b.click()},{passive:false});
      b.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation()},{passive:false});
    });
  }catch(e){}
});
</script></body></html>
