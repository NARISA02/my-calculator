<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ไพ่เร็ว สูตรคำนวน - มือถือ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1e9}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(135deg,#9b761d,#d4af37,#e7e9ec);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;font-weight:800;color:#2b2415}.bar a{color:#2b2415;text-decoration:none;background:#ffffff99;padding:6px 10px;border-radius:999px;touch-action:manipulation}.frame{width:100%;height:calc(100vh - 48px);border:0;background:white}</style></head><body><div class="bar"><span>📱 ไพ่เร็ว สูตรคำนวน — มือถือ</span><a href="index.html">หน้าหลัก</a></div><iframe id="app" class="frame" src="fast-card-formulas-22.html?mobile=3"></iframe><script>app.addEventListener('load',()=>{const d=app.contentDocument;try{const s=d.createElement('style');s.textContent=`html,body{max-width:100%!important;overflow-x:hidden!important;font-size:14px!important}.wrap{width:100%!important;max-width:none!important;padding:10px!important}.grid{grid-template-columns:1fr!important;gap:9px!important}.card{min-width:0!important;padding:13px!important;border-radius:17px!important}.row2,.historyPad,.stats,.moneySummary,.actions,.moneyBox .row2,.moneygrid,.recs{grid-template-columns:1fr!important}.historyPad{gap:9px!important}h2{font-size:19px!important;line-height:1.3!important}h3{font-size:16px!important}label,.note{font-size:13px!important;line-height:1.4!important}select,input,textarea{font-size:16px!important;min-height:43px!important;padding:10px!important}textarea{min-height:205px!important;font-size:17px!important;line-height:1.45!important}.preview{font-size:18px!important;padding:9px!important}.omit{font-size:29px!important}.pad{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px!important}.pad button{min-width:0!important;min-height:46px!important;font-size:19px!important;border-radius:10px!important;touch-action:manipulation!important;-webkit-user-select:none!important;user-select:none!important;-webkit-tap-highlight-color:transparent!important}.padActions button,.actions button,.quick button,.toggle{font-size:14px!important;min-height:40px!important;touch-action:manipulation!important}.quick{gap:6px!important}.quick button{padding:7px 10px!important}.money,.omitbox{padding:11px!important}.scroll{width:100%!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}table{max-width:100%!important}th,td{font-size:12px!important;padding:7px 4px!important;line-height:1.3!important}.item{font-size:12px!important;padding:8px 0!important;line-height:1.35!important}.item .note{font-size:11px!important}.hero{padding:14px!important}.hero h1{font-size:26px!important;line-height:1.2!important}.hero div{font-size:13px!important}.head{gap:8px!important;margin-bottom:10px!important}button,a{touch-action:manipulation!important}@media(min-width:600px){html,body{font-size:13px!important}.wrap{max-width:760px!important;padding:10px!important}.card{padding:12px!important}h2{font-size:18px!important}h3{font-size:15px!important}label,.note{font-size:12px!important}textarea{min-height:190px!important;font-size:16px!important}.pad button{min-height:42px!important;font-size:17px!important}.padActions button,.actions button,.quick button,.toggle{font-size:13px!important;min-height:36px!important}th,td{font-size:11px!important;padding:6px 4px!important}.item{font-size:11px!important;padding:7px 0!important}.hero h1{font-size:24px!important}.hero div{font-size:12px!important}}`;d.head.appendChild(s);d.addEventListener('dblclick',e=>{if(e.target.closest('button,.pad,[data-n]'))e.preventDefault()},{passive:false});d.querySelectorAll('button').forEach(b=>{b.style.touchAction='manipulation'});}catch(e){}});</script></body></html>
