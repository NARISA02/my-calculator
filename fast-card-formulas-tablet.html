<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ไพ่เร็ว สูตรคำนวน - แท็บเล็ต</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1e9}.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(135deg,#9b761d,#d4af37,#e7e9ec);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;color:#2b2415}.bar a{color:#2b2415;text-decoration:none;background:#ffffff99;padding:6px 10px;border-radius:999px}.frame{width:100%;height:calc(100vh - 48px);border:0;background:white}</style></head><body><div class="bar"><span>📲 ไพ่เร็ว สูตรคำนวน — แท็บเล็ต</span><a href="index.html">หน้าหลัก</a></div><iframe id="app" class="frame" src="fast-card-formulas-22.html?tablet=4"></iframe><script>app.addEventListener('load',()=>{const d=app.contentDocument;try{const s=d.createElement('style');s.textContent=`html,body{max-width:100%!important;overflow-x:hidden!important;font-size:14px!important}.wrap{width:100%!important;max-width:1180px!important;padding:10px!important}.grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)!important;gap:10px!important}.card{min-width:0!important;padding:12px!important}.row2{grid-template-columns:minmax(0,1fr) minmax(120px,.42fr)!important}.historyPad{grid-template-columns:minmax(0,1fr) minmax(190px,215px)!important;gap:9px!important}.pad{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:6px!important}.pad button{display:block!important;visibility:visible!important;opacity:1!important;min-width:0!important;min-height:42px!important;font-size:18px!important}.scroll{width:100%!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}table{max-width:100%!important}th,td{font-size:13px!important;padding:8px 6px!important}.item{font-size:13px!important;padding:8px 0!important}.note,label{font-size:12px!important}h2{font-size:20px!important}h3{font-size:16px!important}.hero{padding:16px!important}.hero h1{font-size:clamp(24px,3.2vw,34px)!important}textarea{min-height:210px!important}#positionsBody{display:table-row-group!important}#positionsBody tr{display:table-row!important;visibility:visible!important}#positionsBody td{display:table-cell!important;visibility:visible!important}#positionsBody tr:nth-child(n){height:auto!important}#positionsBody+*{clear:both!important}#positionsBody tr:last-child td{border-bottom:0!important}@media(max-width:760px){.grid{grid-template-columns:1fr!important}.historyPad{grid-template-columns:1fr!important}}`;d.head.appendChild(s);const pos=d.getElementById('positionsBody');if(pos){pos.style.display='table-row-group';Array.from(pos.children).forEach(r=>{r.style.display='table-row';r.style.visibility='visible'})}}catch(e){}});</script></body></html>
