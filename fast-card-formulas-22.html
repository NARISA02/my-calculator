<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กำลังเปิด ไพ่เร็ว สูตรคำนวน...</title>
</head>
<body>
<div style="font-family:system-ui;padding:24px;text-align:center">กำลังโหลด ไพ่เร็ว สูตรคำนวน...</div>
<script>
(async()=>{
  const res=await fetch('fast-card-formulas.html?base=27');
  let html=await res.text();
  html=html
    .replace("['สูตรโต้ดทันใจ V.2',['19','02','13','24','35','46','57','68','79','08']],",'')
    .replace("['สูตรลักษมีประทานพร',['39','05','15','57','85','02','26','39','40','16']],",'')
    .replace("['สูตร ที่ยังมีลมหายใจ',['679','078','189','029','013','124','235','346','457','568']]].map((x,i)=>", "['สูตร ที่ยังมีลมหายใจ',['679','078','189','029','013','124','235','346','457','568']],['สูตรงบน้อย มะปรางค์',['278','348','459','560','167','278','348','459','056','278']],['สูตรไหลตอนนี้',['139','340','135','246','573','684','579','068','197','802']],['สูตรไหลเรียงสาม',['123','234','345','456','567','678','789','890','901','012']],['สูตรทดลองใหม่ A',['127','014','369','158','012','012','045','013','156','145']]].map((x,i)=>")
    .replace('25 สูตร • 5 หลัก','26 สูตร • 5 หลัก');

  const keypadStyle=`<style>
  #keypad{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:7px!important}
  #keypad button{font-size:21px!important;font-weight:1000!important;min-height:50px!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent}
  #history{font-size:18px!important;line-height:1.55!important}
  #preview{font-size:21px!important;letter-spacing:4px!important}
  select,input{font-size:16px!important}
  @media(max-width:520px){#keypad button{font-size:22px!important;min-height:52px!important}#history{font-size:19px!important}}
  </style>`;
  html=html.replace('</head>',"<style id=\"global-readable-font\">\nbody{font-family:\"Noto Sans Thai\",\"Leelawadee UI\",Tahoma,sans-serif!important}\n@media(max-width:900px){\nbody{font-size:20px!important;line-height:1.55!important}\nh1{font-size:31px!important;line-height:1.3!important}\nh2,.subhead{font-size:26px!important;line-height:1.35!important}\nh3{font-size:22px!important;line-height:1.4!important}\nlabel,input,select,button,textarea{font-family:inherit!important;font-size:20px!important}\ntable,table *{font-family:inherit!important;font-size:19px!important}\nth,td{font-size:19px!important;line-height:1.5!important;padding-top:12px!important;padding-bottom:12px!important}\n.help,.note,.action-help,.footer-note{font-size:17px!important;line-height:1.5!important}\n.metric-label{font-size:17px!important}.metric-value{font-size:22px!important}\n.recommend-name{font-size:19px!important}.recommend-meta,.badge{font-size:16px!important}\n.number-key,.pad button,#keypad button{font-size:22px!important;min-height:50px!important}\n}\n</style></head>");html=html.replace('</head>',keypadStyle+'</head>');

  const keypadScript=`<script>
  (function(){
    function fixPad(){
      const pad=document.getElementById('keypad');
      if(!pad)return false;
      const digits=[...pad.children].filter(el=>/^[0-9]$/.test(el.textContent.trim()));
      if(digits.length<10)return false;
      const byNum=Object.fromEntries(digits.map(el=>[el.textContent.trim(),el]));
      ['1','2','3','4','5','6','7','8','9','0'].forEach(n=>byNum[n]&&pad.appendChild(byNum[n]));
      return true;
    }
    if(!fixPad()){let tries=0;const t=setInterval(()=>{tries++;if(fixPad()||tries>30)clearInterval(t)},100);}
  })();
  <\/script>`;
  html=html.replace('</body>',keypadScript+'</body>');

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div style="font-family:system-ui;padding:24px;color:#b42318">เปิดห้องไม่สำเร็จ: '+err.message+'</div>';
});
</script>
</body>
</html>
