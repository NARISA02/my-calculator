:9px;padding:9px;background:#fff}.time-formula-item b{display:block;font-size:13px;margin-bottom:6px;color:#80501b}.time-formula-item .digits{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.time-formula-item .digits span{font-size:11px;text-align:center;padding:4px 1px;background:#fff4d9;border-radius:4px}.time-formula-item .digits strong{display:block;font-size:12px;letter-spacing:1px}</style><script id="timeFormulaInlineScript">(function(){var data={"10":["278","238","059","156","267","238","389","059","156","267"],"00":["238","146","053","948","856","713","681","589","496","405"],"01":["246","357","468","579","068","179","028","139","024","135"],"02":["245","368","047","689","123","579","014","358","679","436"],"03":["157","568","679","780","189","029","013","124","235","346"],"04":["167","279","389","478","158","269","347","458","569","678"],"05":["367","123","234","345","017","126","239","034","125","256"],"06":["278","348","459","056","167","237","348","459","036","167"],"09":["129","023","034","245","356","467","578","689","790","018"]};var old=document.getElementById('timePowerCard');if(old)old.remove();var cards=[...document.querySelectorAll('section.card,div.card,.card')];var target=cards.find(function(c){var h=c.querySelector('h1,h2,h3,h4');return h&&/สูตร|เปรียบเทียบ|คำนวณ/.test(h.textContent)&&!c.querySelector('#timeFormulaInline')})||cards[0]||document.querySelector('main')||document.body;if(!target||document.getElementById('timeFormulaInline'))return;var wrap=document.createElement('div');wrap.className='time-formula-inline';wrap.id='timeFormulaInline';wrap.innerHTML='<h3>สูตรจับกำลังเลขตามช่วงเวลา</h3><div class="hint">สูตรแต่ละช่วงเวลาอยู่รวมในรายการสูตรเดิม • ตัดช่วงที่ซ้ำ 100% ออกแล้ว</div><div class="time-formula-grid">'+Object.keys(data).map(function(k){return '<div class="time-formula-item"><b>จับกำลังเลข '+k+'.00–'+k+'.59 น.</b><div class="digits">'+data[k].map(function(v,i){return '<span>'+i+'<strong>'+v+'</strong></span>'}).join(''
